name: ✅ APH-Search Test Checklist (PC)
description: Run through APH-Search's PC test checklist and report results
title: '[TEST][PC] '
labels:
- testing
assignees:
- MPHONlC
body:
- type: markdown
  attributes:
    value: Thanks for testing **APH-Search** on PC! Check off everything you actually tested and confirmed working. Anything broken or partly working, describe it in the notes field at the end instead of checking it off.
- type: input
  id: version
  attributes:
    label: Add-on version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - PC (NA)
    - PC (EU)
    - PC (PTS)
  validations:
    required: true
- type: checkboxes
  id: pc_tests
  attributes:
    label: PC tests confirmed working
    options:
    - label: 'Open: Press Alt+S, then /fs, then pick Search in the game menu.'
    - label: 'Prefilled search: Type /fs camera. Then type /fs with nothing after it twice.'
    - label: 'Search: Type ''camera''.'
    - label: 'Jump highlight: Pick a setting result.'
    - label: 'Recent searches: Search a few different words, close the bar and open it again.'
    - label: 'Scopes: Press Tab a few times; right-click the scope label.'
    - label: 'Scope settings: Settings > What gets searched: untick a scope.'
    - label: 'Scope ticks: Open What gets searched and look at every tick: Settings, Keybinds, Add-ons, Add-on Settings, Commands, Menus, Achievements, Quests, Antiquities, Map, Wayshrines, Dungeons, Arenas, Trials, Houses, Skills, Champion, Titles, Emotes, Help, Items, Set Items, Collectibles, Allies, Tools, Outfit Styles, Friends, Leaderboards, Crown Store.'
    - label: 'Keybinds: Search a keybind name (for example ''jump'').'
    - label: 'Add-ons: Scope Add-ons: search an add-on.'
    - label: 'Add-on settings: Scope Add-on Settings: search a setting from another add-on.'
    - label: 'Commands: Scope Commands: search ''alc''.'
    - label: 'Menus: Search ''inventory'' in Menus.'
    - label: 'Achievements: Search an achievement name.'
    - label: 'Quests: Search a quest you have; pick it.'
    - label: 'Antiquities: Scope Antiquities: search an antiquity.'
    - label: 'Map: Search a wayshrine, dungeon, trial and house.'
    - label: 'Skills: Search a skill.'
    - label: 'Champion: Search a champion star.'
    - label: 'Collections: Search a collectible, ally, tool, outfit style.'
    - label: 'Set Items: Search ''veiled'', then ''spell damage''.'
    - label: 'Items: Search an item in your bag and in the craft bag.'
    - label: 'Emotes: Search an emote; pick it.'
    - label: 'Friends: Search a friend; whisper, then invite.'
    - label: 'Leaderboards: Search a leaderboard.'
    - label: 'Help / Crown: Search a help topic and a Crown Store item.'
    - label: 'Titles: Search a title you own; pick it.'
    - label: 'Chat messages: Pick a title you own, clear it, pick a quest with none tracked, and pick something that cannot be opened.'
    - label: 'Bar drag and reset: Drag the search bar to a corner, reload, then press Reset Bar Position.'
    - label: 'Bar opacity: Move the Bar opacity slider from 0 to 100.'
    - label: 'Match tooltips: Turn Match tooltips and descriptions off and search a word only found in a description.'
    - label: 'Prefer instant results: Turn Prefer instant results on and off and run a first search of a big scope (Items or Set Items).'
    - label: 'Offer to travel: Turn Offer to travel from the map off and pick a quest, wayshrine and house.'
    - label: 'Reset: Change several settings, then press Reset to Defaults.'
    - label: 'First open: After login, check memory before and after the first search.'
    - label: 'Cleanup: Close the bar after a big search.'
    - label: 'Library Warning: On a fresh install (never seen this warning before), disable LibAddonMenu-2.0 (PC) or LibHarvensAddonSettings (console), then open Settings or reload twice in a row.'
    - label: 'Guide screen arrow: Set a waypoint on the map, close the map and walk a few steps.'
    - label: 'Guide from search: Pick a quest, then a wayshrine, in APH-Search.'
    - label: 'Waypoint level: Set a waypoint near stairs or a bridge, walk toward it, then go up or down a floor.'
    - label: 'Ground arrows: Set a waypoint and walk toward it.'
    - label: 'Arrival: Walk up to the waypoint.'
    - label: 'Learned roads: Turn off Follow roads drawn on the map. Walk a winding road to a spot, go back, then set a waypoint at that spot.'
    - label: 'Guide look: Change Guide style, each color dropdown (screen arrow, ground arrows, destination, map path, map marker, group marks), Guide opacity and Screen arrow height.'
    - label: 'Forget roads: Press Forget learned roads and confirm.'
    - label: '/fsguide: Type /fsguide twice, then set a waypoint and type /fsguide clear.'
    - label: 'Guide keybind: Bind Guide On/Off under Controls > APH-Search and press it twice.'
    - label: 'Other zone: From another zone, set a waypoint on that zone''s map (for example Mournhold on the Deshaan map while in Vvardenfell).'
    - label: 'Way into a zone: wayshrine: Search a place in a zone where you have discovered a wayshrine (for example Mournhold) and pick it.'
    - label: 'Way into a zone: people: Search a place in a zone where you know no wayshrine but a friend, group member or guildmate is there, and pick it.'
    - label: 'Way into a zone: house and dungeon: Search a place in a zone where you know no wayshrine and nobody you know is there, but you own or have visited a house, or found a dungeon or trial.'
    - label: 'No way into a zone: Search a place in a zone where you have nothing at all (for example Shornhelm with no wayshrine, nobody there, no house or dungeon) and pick it.'
    - label: 'Map on another zone: Stand in Vivec City, search Mournhold and pick it, close the map, then open it again while it still shows Deshaan. Then switch it to Vvardenfell.'
    - label: 'Group marks: One player sets a waypoint.'
    - label: 'Leader''s mark: Keep Follow the leader''s mark on (default) and have no waypoint yourself. The leader sets one.'
    - label: 'Follow travel: Ask me: The group leader travels to a wayshrine.'
    - label: 'Follow travel: Automatically: Set When someone in my group travels to Automatically; the leader travels.'
    - label: 'Follow travel: Never and leader only: Set it to Never and have the leader travel; then set Ask me and have a non-leader travel.'
    - label: 'Guide without libraries: Disable LibImplex and LibGroupBroadcast, reload, and set a waypoint.'
    - label: 'Compass letter: Face north, then west, south and east.'
    - label: 'Screen arrow position: With Screen arrow position on Under my character, zoom the camera in and out and turn around; then switch to Top of the screen.'
    - label: 'Map marker: Choose Map marker: Pin 1, set a waypoint on the map, then do the same with Pin 2 and Pin 3; then choose Game default.'
    - label: 'Map path: Set a waypoint and open the map; walk and zoom the map.'
    - label: 'Share tracked quest: In a group with no waypoint, accept the offer to share your tracked quest, then track a different quest.'
    - label: 'Follow a member: Decline the quest offer, accept following a member, then press Guide: Next Group Member (or /fsguide next) a few times.'
    - label: 'Group offer: Join a group with no waypoint; leave and join again. Then turn off Offer quest sharing when I join a group.'
    - label: 'Readable names: Two players look at the same mark or waypoint from opposite sides.'
    - label: 'Map circle: Set a waypoint and open the map. Then turn off Animate the map circle, then turn off Circle my destination on the map.'
    - label: 'Guide designs: Try every choice in Screen arrow design, Ground arrow design and Destination design with a waypoint set.'
    - label: 'Map roads: Press Forget learned roads, then set a waypoint further along a road in a green zone such as Glenumbra or Deshaan. Then turn off Follow roads drawn on the map.'
    - label: 'Live map circle: Open the map, set a waypoint, then set it somewhere else without closing the map.'
    - label: 'Steady map path: With a waypoint set, open the map and zoom in and out with the mouse wheel.'
    - label: 'Steady guide: Walk toward a waypoint while turning the camera; stop and start.'
    - label: 'Record a road: Turn on Record the road I walk (or press the Guide: Record Road key, or type /fsguide record), walk a road for a while, then turn it off. Open the map.'
    - label: 'Recorded road guide: Press Forget learned roads, then set a waypoint at the far end of the road you recorded and walk back to its start.'
    - label: 'Recorded road settings: Record a road shorter than 10 m. Then turn off Show my recorded roads on the map, change Recorded road color, and press Delete recorded roads.'
    - label: 'Clear recent searches: Search a few words, open the search bar''s list (down arrow on an empty box) and click the small bin icon on the RECENT header.'
    - label: 'Quest in another zone: Type /fsguide quest while your tracked quest''s objective is in another zone.'
    - label: 'Member in another zone: Follow a group member (Guide: Next Group Member) who is in another zone.'
    - label: 'Chat notes off: Turn off Chat Logs. Search a place you have no way into, then type /fsguide twice.'
    - label: 'No tooltips: Hover over every setting on the APH-Search settings panel.'
    - label: 'Reach a member: Follow a group member (Guide: Next Group Member) and walk right up to them, then let them walk away.'
    - label: 'Marker in water: Drop a map marker in a lake or the sea a little away from the shore, then walk toward it.'
    - label: 'Marker by walked stairs: Walk up a staircase (Vivec City''s canton stairs work), come back down, then drop a marker on the top landing.'
    - label: 'Roads on other maps: Press Forget learned roads, then set a waypoint along a road in Coldharbour, Clockwork City, Fargrave or the Imperial City, and one across Vivec City''s bridges.'
    - label: 'Dangerous buttons: Hover the warning icons next to Reset Bar Position and Reset to Defaults, then click one.'
    - label: 'Floor routes indoors: In a delve, dungeon or your house, press Forget learned roads and set a waypoint on the far side of the map.'
    - label: 'Waypoint inside a cave: Go into Deep Sea Cavern (Gold Coast) or another cave, walk a few steps, then set a waypoint on the cave''s map.'
    - label: 'Waypoint in a cave from outside: Stand outside a cave, set a waypoint on the cave''s map, then walk in.'
    - label: 'Cave roads stay in the cave: Record a road inside a cave, then open the zone map and the cave map.'
    - label: 'Zoom between city and zone: With a waypoint in a city, open the map on the city, zoom out to the zone map, then back in.'
    - label: 'No travel loop: Search a zone such as Gold Coast, decline the travel offer, follow the guide to your wayshrine and travel there.'
    - label: 'Without the map data: Move the APH-Search-MapData folder out of AddOns, reload, and set a waypoint.'
    - label: 'Hidden collectible: In Collections turn off Show Locked, then search a locked collectible and pick it.'
    - label: 'Map Data status: Open the Guide settings with APH-Search Map Data installed, then turn it off in the Add-Ons menu and reload, then remove its folder and reload.'
- type: textarea
  id: notes
  attributes:
    label: Anything broken, partly working, or not tested
    description: 'One line per issue: which test, what happened instead of Expected.'
    placeholder: 'e.g. PC-L-04 Bug report: popup opened but API version line was blank'
